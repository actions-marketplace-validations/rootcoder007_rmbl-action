name: "rmbl-action"
description: "Verify, refresh and report rmoriebricklayer data capsules in CI"
author: "rootcoder007"
branding:
  icon: "shield"
  color: "blue"

inputs:
  path:
    description: "Directory searched (recursively) for capsules: folders holding data_provenance.json or capsule_bundle.json."
    default: "."
  mode:
    description: "verify (digests, schema, bundle signatures), drift (also re-fetch each source and run the drift battery), refresh (drift, then write changed data and provenance back), report (verify without failing), or sign (pin each data_provenance.json on its first run, write an hmac capsule_bundle.json with key, then verify)."
    default: "verify"
  fail-on:
    description: "error (fail when a capsule does not verify or cannot be fetched), drift (also on drift above psi-fail), warn (also on a column past psi-warn), or never."
    default: "error"
  psi-warn:
    description: "Population stability index above which a changed column is a warning (drftpsi() band: 0.1)."
    default: "0.1"
  psi-fail:
    description: "Population stability index above which a flagged column is drift (drftpsi() band: 0.25); also passed to cpsdrft() as psithr."
    default: "0.25"
  base-ref:
    description: "Branch or ref whose manifest.json / results/manifest.json each capsule is compared with. Defaults to the pull request's base branch; needs it fetched (fetch-depth: 0)."
    default: ""
  comment:
    description: "true: post or update one sticky comment with the report on the pull request (needs GITHUB_TOKEN in the step env and pull-requests: write); dry-run: write it to rmbl-comment.md instead; false."
    default: "false"
  snapshot:
    description: "true: look up the latest Internet Archive snapshot of each http(s) source (wbsnpurl(), read-only, one request per capsule)."
    default: "false"
  key:
    description: "Optional secret, masked in the log: the data.rmorie.com key (exported as MORIE_HOSTED_KEY), or the shared secret an hmac-signed capsule_bundle.json is verified with (cpsbndlvrf(key = )) and, in mode sign, signed with (cpsbndl()); with an hmac bundle present it is not exported to the data service. Pass it from a repository secret."
    required: false
    default: ""
  public-key:
    description: "Optional public key (hex) every capsule_bundle.json must be signed with; for an hmac bundle, its key id (HMAC-SHA-256 of \"public\" under the secret)."
    required: false
    default: ""
  scheme:
    description: "Signature scheme of mode sign; hmac (HMAC-SHA-256 under key) is the one supported."
    default: "hmac"
  overwrite:
    description: "true: mode sign replaces an existing capsule_bundle.json; false: it fails instead."
    default: "false"
  report:
    description: "Path of the Markdown report."
    default: "rmbl-report.md"
  json:
    description: "Path of the machine-readable results."
    default: "rmbl-results.json"
  manifests:
    description: "Optional glob restricting which capsule files are checked, matched against their path (for example 'data/*'); '*' also matches '/'."
    required: false
    default: ""
  wayback:
    description: "true: during refresh, ask the Internet Archive to capture each changed https source (needs IA_S3_ACCESS_KEY and IA_S3_SECRET_KEY in the step env)."
    default: "false"
  cache:
    description: "true: keep fetched sources and data.rmorie.com tables in .rmbl-cache/ of the workspace (restore it with actions/cache). A cached source is used only when the live fetch fails."
    default: "false"
  allow-file:
    description: "true: accept file:// source URLs (local mirrors, tests) that name a file inside the checked-out repository (GITHUB_WORKSPACE); files elsewhere on the runner are never read."
    default: "false"

outputs:
  status:
    description: "ok, warn, drift or error."
  report:
    description: "Path of the Markdown report."
  json:
    description: "Path of the JSON results."
  changed:
    description: "Comma-separated capsule directories whose source data changed."
  verified:
    description: "Number of capsules that verified."
  failed:
    description: "Number of capsules with an error."
  manifest-changed:
    description: "true when a manifest differs from the base ref's copy (pull requests or base-ref)."
  comment:
    description: "off, dry-run, skipped, created, updated or failed."

runs:
  using: "docker"
  image: "Dockerfile"
  env:
    RMBL_PATH: ${{ inputs.path }}
    RMBL_MODE: ${{ inputs.mode }}
    RMBL_FAIL_ON: ${{ inputs.fail-on }}
    RMBL_PUBLIC_KEY: ${{ inputs.public-key }}
    RMBL_REPORT: ${{ inputs.report }}
    RMBL_JSON: ${{ inputs.json }}
    RMBL_MANIFESTS: ${{ inputs.manifests }}
    RMBL_WAYBACK: ${{ inputs.wayback }}
    RMBL_CACHE: ${{ inputs.cache }}
    RMBL_ALLOW_FILE: ${{ inputs.allow-file }}
    RMBL_PSI_WARN: ${{ inputs.psi-warn }}
    RMBL_PSI_FAIL: ${{ inputs.psi-fail }}
    RMBL_BASE_REF: ${{ inputs.base-ref }}
    RMBL_COMMENT: ${{ inputs.comment }}
    RMBL_SNAPSHOT: ${{ inputs.snapshot }}
    RMBL_SCHEME: ${{ inputs.scheme }}
    RMBL_OVERWRITE: ${{ inputs.overwrite }}
