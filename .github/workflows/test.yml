name: test

on:
  push:
  pull_request:
  workflow_call:  # release.yml runs these jobs before it tags

permissions:
  contents: read

jobs:
  modes:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        mode: [verify, report]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the image
        run: docker build -t rmbl-local .
      - name: The base image has the package installed and rmbl on PATH
        run: docker run --rm --entrypoint rmbl rmbl-local version
      - name: Make a capsule with the package
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/github/workspace" -w /github/workspace \
            --entrypoint Rscript rmbl-local tests/make-capsule.R caps/one fixtures/source.csv /github/workspace
      - uses: ./
        id: rmbl
        with:
          path: caps
          mode: ${{ matrix.mode }}
      - name: Check outputs
        run: |
          test "${{ steps.rmbl.outputs.status }}" = ok
          test "${{ steps.rmbl.outputs.verified }}" = 1
          test "${{ steps.rmbl.outputs.failed }}" = 0
          test -s "${{ steps.rmbl.outputs.report }}"
          test -s "${{ steps.rmbl.outputs.json }}"
          grep -q '| `caps/one` |' rmbl-report.md
          grep -q 'schema: data_provenance.json | valid against capsule.schema.json' rmbl-report.md
          grep -q 'round 5 · supp 10' rmbl-report.md
          grep -q '^Footprint of these checks (co2fp()' rmbl-report.md

  cases:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the image
        run: docker build -t rmbl-local .
      - name: Make a plain and a signed capsule with the package
        run: |
          mk() {
            docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/github/workspace" -w /github/workspace \
              --entrypoint Rscript rmbl-local tests/make-capsule.R "$@"
          }
          mk caps/one fixtures/source.csv /github/workspace
          mk signed/b fixtures/signed.csv /github/workspace bundle
          echo "PUB=$(cat signed/b.pub)" >> "$GITHUB_ENV"
          mkdir empty

      - name: Empty directory
        uses: ./
        id: empty
        with:
          path: empty
          report: empty.md
      - run: |
          test "${{ steps.empty.outputs.status }}" = ok
          test "${{ steps.empty.outputs.verified }}" = 0
          grep -q 'No manifests found under `empty`' empty.md

      - name: Signed bundle, expected key
        uses: ./
        id: signed
        with:
          path: signed
          public-key: ${{ env.PUB }}
      - run: test "${{ steps.signed.outputs.status }}" = ok
      - name: Signed bundle, another key
        uses: ./
        id: otherkey
        continue-on-error: true
        with:
          path: signed
          public-key: "00ff"
      - run: |
          test "${{ steps.otherkey.outcome }}" = failure
          test "${{ steps.otherkey.outputs.status }}" = error

      - name: Drift, source unchanged, snapshot lookup skipped for a local source
        uses: ./
        id: same
        with:
          path: caps
          mode: drift
          allow-file: true
          snapshot: true
          report: same.md
      - run: |
          test "${{ steps.same.outputs.status }}" = ok
          test -z "${{ steps.same.outputs.changed }}"
          grep -q 'snapshot: not looked up (not an http(s) source)' same.md

      - name: Rescale the source
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/w" -w /w --entrypoint Rscript rmbl-local -e \
            'd <- read.csv("fixtures/source.csv"); d$value <- d$value * 3 + 2; write.csv(d, "fixtures/source.csv", row.names = FALSE)'
      - name: Drift, fail-on error
        uses: ./
        id: drift
        with:
          path: caps
          mode: drift
          allow-file: true
          json: drift.json
          report: drift.md
      - run: |
          cat drift.md
          test "${{ steps.drift.outputs.status }}" = drift
          test "${{ steps.drift.outputs.changed }}" = caps/one
          grep -q '"result": "drift"' drift.json
          grep -q '| ⚠ drift | value | numeric | KS D' drift.md
      - name: Drift, fail-on drift
        uses: ./
        id: driftfail
        continue-on-error: true
        with:
          path: caps
          mode: drift
          fail-on: drift
          allow-file: true
      - run: test "${{ steps.driftfail.outcome }}" = failure
      - name: Same change under a wide fail band is a warning
        uses: ./
        id: warn
        with:
          path: caps
          mode: drift
          allow-file: true
          psi-fail: 5
          fail-on: drift
      - run: test "${{ steps.warn.outputs.status }}" = warn
      - name: Warning, fail-on warn
        uses: ./
        id: warnfail
        continue-on-error: true
        with:
          path: caps
          mode: drift
          allow-file: true
          psi-fail: 5
          fail-on: warn
      - run: test "${{ steps.warnfail.outcome }}" = failure

      - name: Refresh
        uses: ./
        id: refresh
        with:
          path: caps
          mode: refresh
          fail-on: never
          allow-file: true
      - run: |
          test "${{ steps.refresh.outputs.changed }}" = caps/one
          cmp caps/one/data.csv fixtures/source.csv
          grep -q retrieved_utc caps/one/data_provenance.json
      - name: Verify after refresh
        uses: ./
        id: after
        with:
          path: caps
      - run: test "${{ steps.after.outputs.status }}" = ok

      - name: Tamper with the data
        run: echo "999,1,a" >> caps/one/data.csv
      - name: Tampered, fail-on error
        uses: ./
        id: tampered
        continue-on-error: true
        with:
          path: caps
      - run: |
          test "${{ steps.tampered.outcome }}" = failure
          test "${{ steps.tampered.outputs.status }}" = error
          test "${{ steps.tampered.outputs.failed }}" = 1
      - name: Tampered, fail-on never
        uses: ./
        id: tamperednever
        with:
          path: caps
          fail-on: never
      - run: test "${{ steps.tamperednever.outputs.status }}" = error
      - name: Annotations name the file and the check
        run: |
          docker run --rm -v "$PWD:/github/workspace" -w /github/workspace -e GITHUB_WORKSPACE=/github/workspace \
            -e RMBL_PATH=caps -e RMBL_FAIL_ON=never rmbl-local > annotations.txt
          grep -q '^::error file=caps/one/data_provenance.json,title=rmbl provenance data_sha256::expected ' annotations.txt

      - name: A refused source URL is explained
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/github/workspace" -w /github/workspace \
            --entrypoint Rscript rmbl-local tests/make-capsule.R refused/x fixtures/refused.csv /github/workspace
          sed -i 's#"direct_url": "[^"]*"#"direct_url": "http://127.0.0.1/data.csv"#' refused/x/data_provenance.json
      - uses: ./
        id: refused
        with:
          path: refused
          mode: drift
          fail-on: never
          report: refused.md
      - run: |
          test "${{ steps.refused.outputs.status }}" = error
          grep -q 'a source to fetch must be an https:// URL' refused.md

      - name: A provenance that breaks the capsule schema
        run: |
          mkdir -p badspec/x
          echo '{"resource": {"filename": "d.csv", "sha256": "abc"}}' > badspec/x/data_provenance.json
      - uses: ./
        id: badspec
        with:
          path: badspec
          fail-on: never
          report: badspec.md
      - run: |
          test "${{ steps.badspec.outputs.status }}" = error
          grep -q 'schema: data_provenance.json | $.resource.sha256: does not match' badspec.md

      - name: Unknown mode
        uses: ./
        id: badmode
        continue-on-error: true
        with:
          mode: nonsense
      - run: test "${{ steps.badmode.outcome }}" = failure

  manifests-and-comment:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the image
        run: docker build -t rmbl-local .
      - name: A capsule with a results manifest committed on a base branch, then edited
        run: |
          r() { docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/github/workspace" -w /github/workspace \
                  --entrypoint Rscript rmbl-local "$@"; }
          r tests/make-capsule.R mcaps/one fixtures/m.csv /github/workspace
          r -e 'library(rmoriebricklayer); m <- mkmnf(list(dataset = "fixture"), env = FALSE)
                m <- recrd(m, "mean_x", obs = 5.5, expd = 5.5, tol = 0.01)
                m <- recrd(m, "n", obs = 10, expd = 10, tol = 0)
                wrmnfjs(m, "mcaps/one/manifest.json")'
          git switch -c rmbl-base
          git add mcaps fixtures
          git -c user.name=rootcoder007 -c user.email=278967282+rootcoder007@users.noreply.github.com \
            commit -q -m "base manifest"
          r -e 'library(rmoriebricklayer); m <- mkmnf(list(dataset = "fixture"), env = FALSE)
                m <- recrd(m, "mean_x", obs = 5.505, expd = 5.505, tol = 0.01)
                m <- recrd(m, "n", obs = 11, expd = 11, tol = 0)
                m <- recrd(m, "sd_x", obs = 1.2, expd = 1.2, tol = 0.01)
                wrmnfjs(m, "mcaps/one/manifest.json")'
      - uses: ./
        id: mdiff
        with:
          path: mcaps
          base-ref: rmbl-base
          comment: dry-run
          report: mdiff.md
      - run: |
          cat mdiff.md
          test "${{ steps.mdiff.outputs.manifest-changed }}" = true
          test "${{ steps.mdiff.outputs.comment }}" = dry-run
          grep -q '| ✔ match | mean_x | 5.5 | 5.505 | 0.005 (within tol) | 0.01 |' mdiff.md
          grep -q '| ✖ mismatch | n | 10 | 11 | 1 (outside tol) | 0 |' mdiff.md
          grep -q '| new | sd_x |' mdiff.md
          head -1 rmbl-comment.md | grep -qx '<!-- rmbl-action -->'
      - name: Comment without a token
        uses: ./
        id: notoken
        with:
          path: mcaps
          comment: true
      - run: |
          test "${{ steps.notoken.outputs.comment }}" = skipped
          test "${{ steps.notoken.outputs.status }}" = ok
      - name: Unchanged manifest
        run: git checkout -- mcaps
      - uses: ./
        id: msame
        with:
          path: mcaps
          base-ref: rmbl-base
      - run: test "${{ steps.msame.outputs.manifest-changed }}" = false

  example-r:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the image
        run: docker build -t rmbl-local .
      - name: Author the capsule in R
        run: |
          mkdir -p out/r && cp examples/data/sample.csv out/r/
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/w" -w /w --entrypoint Rscript rmbl-local \
            examples/r/make_capsule.R out/r/sample.csv https://example.org/sample.csv
      - uses: ./
        id: rmbl
        with:
          path: out
      - run: test "${{ steps.rmbl.outputs.status }}" = ok && test "${{ steps.rmbl.outputs.verified }}" = 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: capsule-r
          path: out/r/data_provenance.json

  example-python:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Author the capsule in Python (standard library only)
        run: |
          mkdir -p out/python && cp examples/data/sample.csv out/python/
          python3 examples/python/make_capsule.py out/python/sample.csv https://example.org/sample.csv
      - name: Author a capsule with the README's Python snippet
        run: |
          mkdir -p out/snippet && cp examples/data/sample.csv out/snippet/data.csv
          awk '/^```python$/{f=1; next} /^```$/{f=0} f' README.md > snippet.py
          (cd out/snippet && python3 ../../snippet.py)
      - uses: ./
        id: rmbl
        with:
          path: out
      - run: test "${{ steps.rmbl.outputs.status }}" = ok && test "${{ steps.rmbl.outputs.verified }}" = 2
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: capsule-python
          path: out/python/data_provenance.json

  example-c:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and run the C author (OpenSSL EVP)
        run: |
          test -f /usr/include/openssl/evp.h || (sudo apt-get update && sudo apt-get install -y libssl-dev)
          gcc -std=c11 -O2 -Wall -Wextra -Werror -o make_capsule examples/c/make_capsule.c -lcrypto
          mkdir -p out/c && cp examples/data/sample.csv out/c/
          ./make_capsule out/c/sample.csv https://example.org/sample.csv
      - name: Author a capsule with the README's shell snippet
        run: |
          mkdir -p out/shell && cp examples/data/sample.csv out/shell/data.csv
          awk '/^```sh$/{f=1; next} /^```$/{f=0} f' README.md > snippet.sh
          (cd out/shell && bash ../../snippet.sh)
      - uses: ./
        id: rmbl
        with:
          path: out
      - run: test "${{ steps.rmbl.outputs.status }}" = ok && test "${{ steps.rmbl.outputs.verified }}" = 2
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: capsule-c
          path: out/c/data_provenance.json

  example-python-signed:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # a test value; in a real workflow this comes from a repository secret
      MORIE_CAPSULE_KEY: rmbl-action-test-secret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install morie from GitHub main
        run: pip install --require-hashes -r tests/requirements-morie.txt
      - name: Author and sign the capsule with morie (hmac)
        run: |
          mkdir -p signed/py && cp examples/data/sample.csv signed/py/
          morie capsule init signed/py/sample.csv --url https://example.org/sample.csv
          morie capsule sign signed/py
          morie capsule verify signed/py
          echo "KID=$(python3 -c 'import hashlib, hmac, os; print(hmac.new(os.environ["MORIE_CAPSULE_KEY"].encode(), b"public", hashlib.sha256).hexdigest())')" >> "$GITHUB_ENV"
      - name: Verify with the shared key
        uses: ./
        id: signed
        with:
          path: signed
          key: ${{ env.MORIE_CAPSULE_KEY }}
          public-key: ${{ env.KID }}
          report: signed.md
      - run: |
          cat signed.md
          test "${{ steps.signed.outputs.status }}" = ok
          test "${{ steps.signed.outputs.verified }}" = 1
          grep -q '| ✔ pass | bundle: attestation:key_as_expected | the attestation carries the expected key |' signed.md
          grep -q '| ✔ pass | bundle: attestation:signature | - |' signed.md
      - name: Verify with a wrong key
        uses: ./
        id: wrongkey
        continue-on-error: true
        with:
          path: signed
          key: not-the-signing-secret
          public-key: ${{ env.KID }}
          report: wrongkey.md
      - run: |
          test "${{ steps.wrongkey.outcome }}" = failure
          test "${{ steps.wrongkey.outputs.status }}" = error
          grep -q '| ✖ fail | bundle: attestation:signature | the key given is not the key the attestation names |' wrongkey.md

  examples-agree:
    needs: [example-r, example-python, example-c]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: capsule-*
      - name: The three provenance files match, retrieval date aside
        run: |
          for l in r python c; do jq -S 'del(.source.retrieved)' "capsule-$l/data_provenance.json" > "$l.json"; done
          cat c.json
          cmp r.json python.json
          cmp r.json c.json

  vectors:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the image
        run: docker build -t rmbl-local .
      - name: Re-derive the test vectors with the package and compare them byte for byte
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/w" -w /w --entrypoint Rscript rmbl-local \
            spec/vectors/make.R vectors-out
          diff -r --exclude=make.R spec/vectors vectors-out
          sha256sum spec/vectors/payload.canon.json | grep -q "^$(awk '$1 == "payload_digest" {print $2}' spec/vectors/values.txt) "

  example-native:
    name: example-native (${{ matrix.lang }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        lang: [c, cpp, go, rust, zig, java, node, typescript, bun, lua, sql]
    env:
      EX: ${{ matrix.lang }}
      # a test value; in a real workflow this comes from a repository secret
      # given to the producers only; the action gets it as `key`
      CAPSULE_KEY: rmbl-action-test-secret
      KEY_ID: da884d9bd335b6a01e5354ef0f0f1f3df9a7a7ee8c2c00c7a893e47ed9abd053
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: matrix.lang == 'c' || matrix.lang == 'cpp'
        run: test -f /usr/include/openssl/evp.h || (sudo apt-get update && sudo apt-get install -y libssl-dev)
      - if: matrix.lang == 'sql'
        run: command -v sqlite3 || (sudo apt-get update && sudo apt-get install -y sqlite3)
      - if: matrix.lang == 'go'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false
      - if: matrix.lang == 'rust'
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - if: matrix.lang == 'zig'
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.14.1
          use-cache: false
      - if: matrix.lang == 'java'
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - if: matrix.lang == 'node' || matrix.lang == 'typescript'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - if: matrix.lang == 'bun'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
          no-cache: true
      - if: matrix.lang == 'lua'
        uses: leafo/gh-actions-lua@6919171ccf181b826f44b9bca76307b577217377 # v13.0.0
        with:
          luaVersion: "5.4"
          buildCache: false
      - name: The producer writes the test vectors byte for byte
        env:
          RMBL_KEY: ${{ env.CAPSULE_KEY }}
          RMBL_UTC: "2026-01-01T00:00:00Z"
          RMBL_NOTE_FILE: spec/vectors/note.txt
        run: |
          sh "examples/$EX/run.sh" "vec/$EX"
          for f in data.csv data_provenance.json capsule_bundle.json; do cmp "spec/vectors/capsule/$f" "vec/$EX/$f"; done
      - name: The producer writes a capsule now
        env:
          RMBL_KEY: ${{ env.CAPSULE_KEY }}
        run: sh "examples/$EX/run.sh" "out/$EX"
      - uses: ./
        id: rmbl
        with:
          path: out
          key: ${{ env.CAPSULE_KEY }}
          public-key: ${{ env.KEY_ID }}
          report: native.md
      - run: |
          cat native.md
          test "${{ steps.rmbl.outputs.status }}" = ok
          test "${{ steps.rmbl.outputs.verified }}" = 1
          grep -qF '| ✔ pass | bundle: attestation:signature | - |' native.md
          grep -qF '| ✔ pass | bundle: no_unlisted_files | - |' native.md
      - name: Flip one byte of the data
        run: printf 7 | dd of="out/$EX/data.csv" bs=1 seek=4 count=1 conv=notrunc
      - uses: ./
        id: tampered
        continue-on-error: true
        with:
          path: out
          key: ${{ env.CAPSULE_KEY }}
          public-key: ${{ env.KEY_ID }}
          report: tampered.md
      - run: |
          test "${{ steps.tampered.outcome }}" = failure
          test "${{ steps.tampered.outputs.status }}" = error
          grep -F '| ✖ fail | bundle: file:data.csv |' tampered.md
          grep -F '| ✖ fail | data_sha256 |' tampered.md

  example-sign:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # a test value; in a real workflow this comes from a repository secret
      # not RMBL_KEY: a job env of that name reaches the action's container (see Inputs in the README)
      CAPSULE_KEY: rmbl-action-test-secret
      KEY_ID: da884d9bd335b6a01e5354ef0f0f1f3df9a7a7ee8c2c00c7a893e47ed9abd053
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Two producers with no crypto and no JSON library (POSIX sh, awk)
        run: |
          sh examples/any/produce.sh any/sh
          mkdir -p any/awk && awk -v dir=any/awk -f examples/any/produce.awk
      - name: Sign with the action
        uses: ./
        id: sign
        with:
          path: any
          mode: sign
          key: ${{ env.CAPSULE_KEY }}
          report: sign.md
      - run: |
          cat sign.md
          test "${{ steps.sign.outputs.status }}" = ok
          test "${{ steps.sign.outputs.verified }}" = 2
          for d in any/sh any/awk; do
            test -s "$d/capsule_bundle.json"
            jq -e '.resource.sha256 | test("^[0-9a-f]{64}$")' "$d/data_provenance.json"
            jq -e --arg k "$KEY_ID" '.attestation.public == $k and .attestation.scheme == "hmac"' "$d/capsule_bundle.json"
          done
          jq -e '.resource.row_count_data_rows == 3' any/awk/data_provenance.json
      - name: Verify, pinning the key id
        uses: ./
        id: verify
        with:
          path: any
          key: ${{ env.CAPSULE_KEY }}
          public-key: ${{ env.KEY_ID }}
          report: verify.md
      - run: |
          test "${{ steps.verify.outputs.status }}" = ok
          test "$(grep -cF '| ✔ pass | bundle: attestation:signature | - |' verify.md)" = 2
      - name: Signing again without overwrite
        uses: ./
        id: again
        continue-on-error: true
        with:
          path: any
          mode: sign
          key: ${{ env.CAPSULE_KEY }}
      - run: test "${{ steps.again.outcome }}" = failure
      - name: Signing again with overwrite
        uses: ./
        id: overwrite
        with:
          path: any
          mode: sign
          key: ${{ env.CAPSULE_KEY }}
          overwrite: true
      - run: test "${{ steps.overwrite.outputs.status }}" = ok
      - name: Signing without a key
        uses: ./
        id: nokey
        continue-on-error: true
        with:
          path: any
          mode: sign
          overwrite: true
      - run: test "${{ steps.nokey.outcome }}" = failure
      - name: Flip one byte of the data
        run: printf 7 | dd of=any/sh/data.csv bs=1 seek=4 count=1 conv=notrunc
      - uses: ./
        id: tampered
        continue-on-error: true
        with:
          path: any
          key: ${{ env.CAPSULE_KEY }}
          public-key: ${{ env.KEY_ID }}
          report: tampered.md
      - run: |
          test "${{ steps.tampered.outcome }}" = failure
          test "${{ steps.tampered.outputs.failed }}" = 1
          grep -F '| ✖ fail | bundle: file:data.csv |' tampered.md

  key-input-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # a test value; a job env named like the action's variable must not stand in for the key input
      CAPSULE_KEY: rmbl-action-test-secret
      RMBL_KEY: rmbl-action-test-secret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: A plain capsule
        run: sh examples/any/produce.sh any/sh
      - name: Sign with no key input, a job-level RMBL_KEY set
        uses: ./
        id: jobkey
        continue-on-error: true
        with:
          path: any
          mode: sign
      - run: |
          test "${{ steps.jobkey.outcome }}" = failure
          test ! -e any/sh/capsule_bundle.json
      - name: The key input still signs
        uses: ./
        id: inputkey
        with:
          path: any
          mode: sign
          key: ${{ env.CAPSULE_KEY }}
      - run: |
          test "${{ steps.inputkey.outputs.status }}" = ok
          test -s any/sh/capsule_bundle.json

  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: zizmor (workflows, action.yml, dependabot.yml)
        env:
          GH_TOKEN: ${{ github.token }}  # online audits: impostor commits, known-vulnerable actions
        run: pipx run zizmor==1.31.1 --min-severity low .
      - name: The base image is pinned by digest
        run: grep -Eq '^FROM [^ ]+@sha256:[0-9a-f]{64}$' Dockerfile
      - name: shellcheck (entrypoint.sh, the fuzz build script)
        run: shellcheck --severity=style entrypoint.sh .clusterfuzzlite/build.sh
      - name: hadolint (Dockerfile, the fuzz Dockerfile)
        run: |
          docker run --rm -i hadolint/hadolint@sha256:32dac94127fd60b7b7e3fbfc65e1383b9b5e25c9bfd7b8536de7a539fe68a12d hadolint - < Dockerfile
          docker run --rm -i hadolint/hadolint@sha256:32dac94127fd60b7b7e3fbfc65e1383b9b5e25c9bfd7b8536de7a539fe68a12d hadolint --ignore DL3008 - < .clusterfuzzlite/Dockerfile
