version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: actions
    groups:
      actions:
        patterns: ["*"]
  # the base image: a new digest for the pinned tag, or a newer tag, opens a pull request
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: daily
    commit-message:
      prefix: base image
